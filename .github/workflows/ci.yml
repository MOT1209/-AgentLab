name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # Windows is in the matrix because most of the suite runs there too, and a green ubuntu-only
    # CI hides portability bugs (it did: path separators and POSIX-only fixtures). The simulated-adb
    # tests skip themselves on win32 with a reason; see test/support/fake-adb.ts.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run skills:validate
